<style>
    .matrix-bg {
        position: fixed;
        inset: 0;
        z-index: -999;
        background-color: #000;
        pointer-events: none;
        overflow: hidden;
    }
    .matrix-col {
        position: absolute;
        top: -100%;
        color: #0f0;
        font-family: monospace;
        font-size: 16px;
        line-height: 1.3;
        white-space: pre;
        animation: matrixRoll linear infinite;
    }
    @keyframes matrixRoll {
            0% {transform: translateY(0);}
            100% {transform: translateY(200vh);}
    }
</style>

<script>
    function a(){
        var n = 300;
        for(var i=1;i<=n;i++){
            //     alert('出现了一个错误，请删除Windows。这是第'+i+'次警告！');
        
        
        
            setTimeout(() => {

<script>
    const bg = document.getElementById('matrixBg');
    function createLine() {
        const col = document.createElement('div');
        col.className = 'matrix-col';
        col.style.left = Math.random() * 100 + '%';
        const speed = 7 + Math.random() * 14;
        col.style.animationDuration = speed + 's';
        let str = '';
        const len = Math.floor(window.innerHeight / 18);
        for(let i = 0; i < len; i++) {
            str += Math.round(Math.random()) + '\n';
        }
        col.innerText = str;
        bg.appendChild(col);
        setTimeout(() => {
            col.remove();
            createLine();
        }, speed * 1000);
    }
    function initMatrix() {
        bg.innerHTML = '';
        const count = Math.floor(window.innerWidth / 20);
        for(let i = 0; i < count; i++) createLine();
    }
    initMatrix();
    window.onresize = initMatrix;
</script>
